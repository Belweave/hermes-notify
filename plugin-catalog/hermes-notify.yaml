# Catalog submission draft for NousResearch/hermes-agent. Not yet submitted.
# Pinned to the published plugin commit b95b34900b7de15c12430295b124005f6499744a on Belweave/hermes-notify.
name: hermes-notify
title: Hermes Pocket
repo: https://github.com/Belweave/hermes-notify
sha: "b95b34900b7de15c12430295b124005f6499744a"
description: Release workspaces, progress, replies and exact phone approvals through Notify.
maintainer: belweave
tier: community
category: automation
version: "0.2.0"
readme: true
platforms: [macos]
screenshots:
  - https://raw.githubusercontent.com/Belweave/hermes-notify/b95b34900b7de15c12430295b124005f6499744a/docs/screenshots/release-phone.png
  - https://raw.githubusercontent.com/Belweave/hermes-notify/b95b34900b7de15c12430295b124005f6499744a/docs/screenshots/approval-phone.png
  - https://raw.githubusercontent.com/Belweave/hermes-notify/b95b34900b7de15c12430295b124005f6499744a/docs/screenshots/shipped-phone.png
known_issues:
  - One native phone approval passed; the full deployed App, sign-in and Live Activity flow remain unverified.
  - A configured Cloudflare Worker and verified origin-specific owner are needed for private Apps.
  - Requires the public approval transport and Desktop SDK; a minimum released Hermes version is not yet verified.
capabilities:
  provides_tools:
    - notify_release
    - notify_publish_app
    - notify_send
    - notify_ask
    - notify_replies
    - notify_status
  provides_hooks:
    - pre_approval_request
    - post_approval_response
  provides_middleware: []
  requires_env:
    - NOTIFY_API_TOKEN
