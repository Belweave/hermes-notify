manifest_version: 2
name: hermes-notify
version: "0.2.3"
description: Hermes Pocket release workspaces, rich updates, replies and exact phone approvals.
author: Preetham Kyanam
license: MIT
kind: standalone
requires_env:
  - name: NOTIFY_API_TOKEN
    description: "Press Enter to skip; `hermes notify setup` signs you in and saves it for you"
    url: https://notify.belweave.ai/docs
    secret: true
optional_env:
  - NOTIFY_WEBHOOK_SECRET
  - HERMES_NOTIFY_PUBLISH_TOKEN
  - HERMES_NOTIFY_TEST_URL
  - HERMES_NOTIFY_TEST_WORKER_URL
config_schema:
  enabled:
    type: bool
    default: false
    description: Enable profile-scoped Notify operations. `hermes notify setup` turns this on; changes apply without a restart.
  timeout_seconds:
    type: int
    default: 120
    description: Phone approval wait, also bounded by the Hermes request deadline.
  device_id:
    type: str
    default: ""
    description: Optional Notify device ID. Empty uses account routing.
  publisher_origin:
    type: str
    default: ""
    description: Operator-configured public HTTPS Worker origin, with no path.
  worker_name:
    type: str
    default: ""
    description: Worker name used with worker_subdomain when publisher_origin is empty.
  worker_subdomain:
    type: str
    default: ""
    description: Configured workers.dev account subdomain.
  progress_enabled:
    type: bool
    default: false
    description: Send event-driven Live Activity progress with ordinary update fallback.
  progress_interval_seconds:
    type: int
    default: 5
    description: Minimum routine progress interval, clamped to 5..300 seconds.
  retention_days:
    type: int
    default: 30
    description: Completed journal retention, clamped to 1..90 days. Uncertain writes remain until reconciled.
  allow_reply_injection:
    type: bool
    default: false
    description: Permit explicit same-session injection of phone answers (approval, yes_no and reply questions), subject to Hermes authorization.
  inbound_webhook_port:
    type: int
    default: 0
    description: Port for signed Notify answer webhooks (0 = off). `hermes notify webhooks on` sets it.
  inbound_webhook_host:
    type: str
    default: "127.0.0.1"
    description: Interface for the answer webhook listener. Keep 127.0.0.1 behind a tunnel or `boat host --localhost`.
  inbound_webhook_id:
    type: str
    default: ""
    description: Notify webhook ID created by `hermes notify webhooks on`, removed by `off`.
provides_tools:
  - notify_release
  - notify_publish_app
  - notify_send
  - notify_ask
  - notify_replies
  - notify_status
provides_hooks:
  - pre_approval_request
  - post_approval_response
