[project]
name = "hermes-notify"
version = "0.2.3"
description = "Hermes Pocket release workspaces, progress and phone decisions through Notify"
requires-python = ">=3.11"
# No runtime dependencies: Hermes installs nothing and asks no consent.
# Dev/test tools live in requirements-dev.txt.
dependencies = []


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
